<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@700&family=Noto+Sans+JP:wght@500;700&family=Zen+Old+Mincho:wght@700&display=swap');
    *{box-sizing:border-box;margin:0;padding:0}html,body{width:1220px;height:1016px;overflow:hidden;background:#08101e}.card{position:relative;width:1220px;height:1016px;overflow:hidden;background:#08101e;color:#fff}.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}.veil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,12,24,.99) 0%,rgba(5,12,24,.94) 37%,rgba(5,12,24,.3) 66%,rgba(5,12,24,.08) 100%)}.copy{position:absolute;left:70px;top:74px;width:690px}.name{font:700 52px 'Zen Old Mincho',serif;letter-spacing:.05em}.name small{font:700 22px 'Noto Sans JP',sans-serif;color:#e4bd78;margin-left:18px}.headline{margin-top:64px;font:700 44px/1.65 'Zen Old Mincho',serif;letter-spacing:0;white-space:nowrap}.headline em{display:block;font-size:58px;font-style:normal;color:#f2ca84}.topics{margin-top:44px;font:500 22px 'Noto Sans JP',sans-serif;letter-spacing:.08em;color:#d3dbe8}.price{display:inline-block;margin-top:38px;padding:15px 26px;border:1px solid rgba(242,202,132,.55);font:700 23px 'Noto Sans JP',sans-serif;color:#f2ca84}.stats{position:absolute;left:70px;right:70px;bottom:55px;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(5,12,24,.88);border:1px solid rgba(217,174,104,.42)}.stat{padding:22px 8px;text-align:center;border-right:1px solid rgba(217,174,104,.3)}.stat:last-child{border-right:0}.stat b{display:block;font:700 31px 'DM Sans','Noto Sans JP',sans-serif;color:#f2ca84}.stat span{display:block;margin-top:4px;font:500 12px 'Noto Sans JP',sans-serif;color:#c7d0de}.note{position:absolute;right:74px;bottom:25px;font:500 10px 'Noto Sans JP',sans-serif;color:#8d99aa}
  </style>
</head>
<body><main class="card"><img class="photo" src="assets/service-portrait-v2.png" alt=""><div class="veil"></div><div class="copy"><div class="name">流夢 <small>るうむ</small></div><div class="headline">聴いてくれる人がいるって、<em>なんだか安心</em></div><div class="topics">恋愛　仕事　人間関係　ただの雑談</div><div class="price">電話相談　1分500円</div></div><div class="stats"><div class="stat"><b>8年</b><span>音声アプリ歴</span></div><div class="stat"><b>1,000人+</b><span>延べ会話人数</span></div><div class="stat"><b>80%超</b><span>マッチ率</span></div><div class="stat"><b>50%</b><span>リピート率</span></div></div><div class="note">※GoodNightでの本人自己集計</div></main></body>
</html>
