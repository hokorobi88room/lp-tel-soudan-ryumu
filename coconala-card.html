<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@700&family=Noto+Sans+JP:wght@500;700&family=Zen+Old+Mincho:wght@700&display=swap');
*{box-sizing:border-box}
html,body{margin:0;width:1220px;height:1240px;overflow:hidden;background:#09111f}
.card{position:relative;width:1220px;height:1240px;color:#fff;overflow:hidden;background:#0b1424}
.photo{position:absolute;right:0;top:0;width:650px;height:1240px;object-fit:cover;object-position:63% 60%}
.veil{position:absolute;inset:0;background:linear-gradient(90deg,#09111f 0%,#0c1627 42%,rgba(12,22,39,.72) 57%,rgba(9,17,31,.04) 86%),linear-gradient(0deg,rgba(7,13,24,.58),transparent 42%)}
.copy{position:absolute;left:72px;top:78px;width:690px}.tag{font:700 20px 'DM Sans',sans-serif;letter-spacing:.28em;color:#dfb66e;margin-bottom:62px}.name{font:700 32px 'Zen Old Mincho',serif;margin-bottom:36px}.name small{font:700 15px 'DM Sans';letter-spacing:.18em;color:#d9ae68;margin-left:15px}.kicker{font:700 29px 'Noto Sans JP',sans-serif;color:#e6c486;margin-bottom:16px}
.headline{font:700 58px/1.48 'Zen Old Mincho',serif;letter-spacing:.01em;text-shadow:0 4px 30px rgba(0,0,0,.4)}
.headline em{display:inline-block;white-space:nowrap;font-style:normal;color:#f2d08d;border-bottom:8px solid rgba(217,174,104,.24)}
.topics{margin-top:38px;font:500 21px 'Noto Sans JP';letter-spacing:.09em;color:#d6deeb}
.stats{position:absolute;left:72px;bottom:72px;width:1076px;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(8,15,28,.86);border:1px solid rgba(217,174,104,.38);backdrop-filter:blur(10px)}.stat{padding:24px 13px;text-align:center;border-right:1px solid rgba(217,174,104,.28)}.stat:last-child{border-right:0}.stat b{display:block;font:700 34px 'DM Sans',sans-serif;color:#f2d08d}.stat span{display:block;margin-top:4px;font:500 13px 'Noto Sans JP';color:#c6d0df}.note{position:absolute;left:78px;bottom:31px;font:500 11px 'Noto Sans JP';color:#8f9bad}
</style></head><body><main class="card"><img class="photo" src="assets/hero-night-radio.webp" alt=""><div class="veil"></div><div class="copy"><div class="tag">ROOMU'S NIGHT TALK</div><div class="name">流夢 <small>ROOMU / 28</small></div><div class="kicker">話す内容は、決めなくて大丈夫。</div><div class="headline">眠れない夜に、<br><em>ちゃんと話を聞く声を。</em></div><div class="topics">恋愛　仕事　人間関係　ただの雑談</div></div><div class="stats"><div class="stat"><b>8年</b><span>音声アプリ歴</span></div><div class="stat"><b>1,000人+</b><span>延べ会話人数</span></div><div class="stat"><b>80%超</b><span>マッチ率</span></div><div class="stat"><b>50%</b><span>リピート率</span></div></div><div class="note">※GoodNightでの本人自己集計</div></main></body></html>
